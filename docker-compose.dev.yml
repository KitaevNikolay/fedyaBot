services:
  db:
    image: mysql:8.0.36
    env_file:
      - .env.dev
    ports:
      - "3306:3306"
    volumes:
      - db_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: "mysql://fedya:fedya@db:3306/fedya"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  cabinet-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: "mysql://fedya:fedya@db:3306/fedya"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      CABINET_PORT: 3001
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: ["sh", "-c", "npm run migrate:deploy && npm run start:cabinet:dev"]

  cabinet-frontend:
    build:
      context: .
      dockerfile: cabinet/Dockerfile
      args:
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    ports:
      - "5173:80"
    depends_on:
      cabinet-api:
        condition: service_started

  cabinet-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: "mysql://fedya:fedya@db:3306/fedya"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      CABINET_PORT: 3001
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: ["sh", "-c", "npm run migrate:deploy && npm run start:cabinet:dev"]

  cabinet-frontend:
    build:
      context: .
      dockerfile: cabinet/Dockerfile
      args:
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    ports:
      - "5173:80"
    depends_on:
      cabinet-api:
        condition: service_started

  redis:
    image: redis:7.2.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data_dev:
  redis_data_dev:
